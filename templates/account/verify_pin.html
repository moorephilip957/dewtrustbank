{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIN Verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- custom css -->
    <link rel="stylesheet" href="{% static 'account/verifypin.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <!-- SUCCESS SCREEN -->
    <div class="success-overlay" id="success">
        <div class="checkmark">✓</div>
        <h4 class="mt-3">Verification Successful</h4>
    </div>

    <div class="auth-card">

        <!-- ================= TOP SECTION ================= -->
        <div class="top-section">
            <div class="circle one"></div>
            <div class="circle two"></div>

            <h4>Verify Your Identity</h4>
            <p>Please enter your secure 4-digit PIN to continue</p>
            {% include "../components/form_errors.html" %}
        {% include "../components/messages.html" %}
        </div>
        
        <!-- ================= IMAGE SECTION ================= -->
        <div class="image-section">
            <img class="avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="user">
        </div>

        <!-- ================= FORM SECTION ================= -->
        <div class="form-section">

            <p class="text-center text-muted small">
                Enter your 6-digit verification PIN
            </p>

            <form method="POST" id="otpForm">
                {% csrf_token %}

                <!-- DESKTOP INPUT -->
                <div class="desktop-only">

                    <div class="otp-box">
                        <input type="text" maxlength="1" class="otp">
                        <input type="text" maxlength="1" class="otp">
                        <input type="text" maxlength="1" class="otp">
                        <input type="text" maxlength="1" class="otp">
                        <input type="text" maxlength="1" class="otp">
                        <input type="text" maxlength="1" class="otp">
                    </div>

                    <!-- Hidden combined OTP -->
                    <input type="hidden" name="desktop_otp" id="fullOtp">

                </div>


                <!-- MOBILE INPUT -->
                <div class="mobile-only">

                    <input id="mobileOtp" class="form-control text-center mb-3" readonly placeholder="Enter OTP">

                    <!-- Hidden mobile OTP -->
                    <input type="hidden" name="mobile_otp" id="mobileHiddenOtp">

                    <div class="keypad">

                        <button type="button" onclick="addNum(1)">1</button>
                        <button type="button" onclick="addNum(2)">2</button>
                        <button type="button" onclick="addNum(3)">3</button>

                        <button type="button" onclick="addNum(4)">4</button>
                        <button type="button" onclick="addNum(5)">5</button>
                        <button type="button" onclick="addNum(6)">6</button>

                        <button type="button" onclick="addNum(7)">7</button>
                        <button type="button" onclick="addNum(8)">8</button>
                        <button type="button" onclick="addNum(9)">9</button>

                        <button type="button" onclick="clearOtp()">C</button>
                        <button type="button" onclick="addNum(0)">0</button>
                        <button type="button" onclick="backspace()">⌫</button>

                    </div>

                </div>

                <button type="submit" class="btn-verify">
                    Verify Pin
                </button>

            </form>

        </div>

    </div>


    <script>
        /* ================= DESKTOP OTP ================= */

        const inputs = document.querySelectorAll(".otp");
        const form = document.getElementById("otpForm");
        const hiddenOtp = document.getElementById("fullOtp");

        inputs.forEach((input, index) => {

            // move to next input
            input.addEventListener("input", () => {

                if (
                    input.value.length === 1 &&
                    index < inputs.length - 1
                ) {
                    inputs[index + 1].focus();
                }

            });

            // backspace support
            input.addEventListener("keydown", (e) => {

                if (
                    e.key === "Backspace" &&
                    !input.value &&
                    index > 0
                ) {
                    inputs[index - 1].focus();
                }

            });

        });

        /* ================= MOBILE OTP ================= */

        let mobileOtp = "";

        function addNum(n) {

            if (mobileOtp.length < 6) {

                mobileOtp += n;

                document.getElementById("mobileOtp").value = mobileOtp;

                document.getElementById("mobileHiddenOtp").value = mobileOtp;
            }
        }

        function clearOtp() {

            mobileOtp = "";

            document.getElementById("mobileOtp").value = "";

            document.getElementById("mobileHiddenOtp").value = "";
        }

        function backspace() {

            mobileOtp = mobileOtp.slice(0, -1);

            document.getElementById("mobileOtp").value = mobileOtp;

            document.getElementById("mobileHiddenOtp").value = mobileOtp;
        }

        /* ================= FORM SUBMIT ================= */

        form.addEventListener("submit", function () {

            let otp = "";

            // desktop OTP
            inputs.forEach(input => {
                otp += input.value;
            });

            hiddenOtp.value = otp;

        });
    </script>
</body>

</html>
