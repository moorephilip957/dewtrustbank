<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        First Havin Bank
        {% endblock %}
    </title>

</head>

<body style="
    margin:0;
    padding:0;
    background:#f4f7fb;
    font-family:Arial, Helvetica, sans-serif;
">

    <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
    >

        <tr>

            <td align="center" style="padding:40px 15px;">

                <table
                    width="100%"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    style="
                        max-width:650px;
                        background:#ffffff;
                        border-radius:14px;
                        overflow:hidden;
                        box-shadow:0 4px 20px rgba(0,0,0,0.08);
                    "
                >

                    <!-- HEADER -->
                    <tr>

                        <td style="
                            background:#0037CC;
                            padding:30px;
                            text-align:center;
                        ">

                            <h1 style="
                                color:#ffffff;
                                margin:0;
                                font-size:28px;
                                font-weight:700;
                            ">
                                First Havin Bank
                            </h1>

                            <p style="
                                color:rgba(255,255,255,0.8);
                                margin-top:8px;
                                font-size:14px;
                            ">
                                Secure Digital Banking
                            </p>

                        </td>

                    </tr>

                    <!-- CONTENT -->
                    <tr>

                        <td style="
                            padding:40px 35px;
                            color:#222;
                        ">

                            {% block content %}

                            {% endblock %}

                        </td>

                    </tr>

                    <!-- FOOTER -->
                    <tr>

                        <td style="
                            background:#f7f9fc;
                            padding:25px;
                            text-align:center;
                            border-top:1px solid #eaeaea;
                        ">

                            <p style="
                                margin:0;
                                color:#666;
                                font-size:13px;
                                line-height:22px;
                            ">
                                © {% now "Y" %} First Havin Bank.
                                All rights reserved.
                            </p>

                            <p style="
                                margin-top:10px;
                                color:#999;
                                font-size:12px;
                            ">
                                This is an automated message.
                                Please do not reply directly.
                            </p>

                        </td>

                    </tr>

                </table>

            </td>

        </tr>

    </table>

</body>

</html>
