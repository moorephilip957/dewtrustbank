<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Successful</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f5;
            padding: 40px 20px;
        }

        /* ---------- Animated Background ---------- */
        .bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
        }

        .bg-wrapper .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite alternate;
        }

        .bg-wrapper .circle:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #6c63ff;
            top: -10%;
            left: -5%;
            animation-delay: 0s;
        }

        .bg-wrapper .circle:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00c9a7;
            bottom: -10%;
            right: -5%;
            animation-delay: 2s;
        }

        .bg-wrapper .circle:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #ff6b6b;
            top: 50%;
            left: 60%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.1); }
        }

        /* ---------- Card ---------- */
        .tx-card {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            color: #fff;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: cardEntry 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }

        @keyframes cardEntry {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------- Success Icon ---------- */
        .success-icon-wrapper {
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon-wrapper .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00c9a7;
            border-right-color: #00c9a7;
            animation: spin 1.2s linear infinite;
        }

        .success-icon-wrapper .ring:nth-child(2) {
            inset: 8px;
            border-top-color: #6c63ff;
            border-left-color: #6c63ff;
            animation-direction: reverse;
            animation-duration: 1.8s;
        }

        .success-icon-wrapper .ring:nth-child(3) {
            inset: 16px;
            border-bottom-color: #ffd93d;
            border-right-color: #ffd93d;
            animation-duration: 2.4s;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-icon-wrapper i {
            font-size: 40px;
            color: #00c9a7;
            z-index: 2;
            animation: popIn 0.5s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* ---------- Typography ---------- */
        .tx-card .title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff, #c8c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tx-card .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            font-weight: 400;
        }

        /* ---------- Amount ---------- */
        .amount {
            text-align: center;
            margin-bottom: 36px;
        }

        .amount .currency {
            font-size: 1.4rem;
            font-weight: 600;
            vertical-align: top;
            color: #00c9a7;
            line-height: 1.8;
        }

        .amount .value {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00c9a7, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        /* ---------- Details ---------- */
        .details-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .details-list .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .details-list .detail-item:last-child {
            border-bottom: none;
        }

        .details-list .detail-item:nth-child(1) { animation-delay: 0.4s; }
        .details-list .detail-item:nth-child(2) { animation-delay: 0.5s; }
        .details-list .detail-item:nth-child(3) { animation-delay: 0.6s; }
        .details-list .detail-item:nth-child(4) { animation-delay: 0.7s; }
        .details-list .detail-item:nth-child(5) { animation-delay: 0.8s; }
        .details-list .detail-item:nth-child(6) { animation-delay: 0.9s; }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .detail-item .label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .detail-item .label i {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.35);
        }

        .detail-item .val {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            text-align: right;
        }

        .detail-item .val.muted {
            color: rgba(255, 255, 255, 0.55);
            font-weight: 400;
        }

        .badge-success {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 201, 167, 0.15);
            color: #00c9a7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-success i {
            font-size: 0.7rem;
        }

        /* ---------- Buttons ---------- */
        .btn-group-custom {
            display: flex;
            gap: 12px;
            margin-top: 36px;
            animation: fadeUp 0.5s 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .btn-receipt {
            flex: 1;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-receipt:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-done {
            flex: 1;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #6c63ff, #00c9a7);
            color: #fff;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-done:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
            color: #fff;
        }

        /* ---------- Confetti Particles ---------- */
        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            top: -10px;
            animation: confettiFall linear forwards;
            z-index: -1;
        }

        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 576px) {
            .tx-card {
                padding: 36px 24px;
                border-radius: 20px;
            }

            .amount .value {
                font-size: 2.4rem;
            }

            .tx-card .title {
                font-size: 1.3rem;
            }

            .btn-group-custom {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-wrapper">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Confetti Container -->
    <div id="confetti-container"></div>

    <!-- Transaction Card -->
    <div class="tx-card">

        <!-- Success Icon -->
        <div class="success-icon-wrapper">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <i class="bi bi-check2"></i>
        </div>

        <!-- Title -->
        <h2 class="title">Transaction Successful!</h2>
        <p class="subtitle">Your payment has been processed</p>

        <!-- Amount -->
        <div class="amount">
            <span class="currency">$</span><span class="value">2,450.00</span>
        </div>

        <!-- Transaction Details -->
        <ul class="details-list">
            <li class="detail-item">
                <span class="label">
                    <i class="bi bi-clock"></i>
                    Date &amp; Time
                </span>
                <span class="val muted">May 10, 2026 • 2:34 PM</span>
            </li>
            <li class="detail-item">
                <span class="label">
                    <i class="bi bi-hash"></i>
                    Reference
                </span>
                <span class="val">TXN-8F4A2C9D1E</span>
            </li>
            <li class="detail-item">
                <span class="label">
                    <i class="bi bi-person"></i>
                    Sent To
                </span>
                <span class="val">Sarah Johnson</span>
            </li>
            <li class="detail-item">
                <span class="label">
                    <i class="bi bi-bank"></i>
                    Bank
                </span>
                <span class="val muted">Chase Bank •••• 4821</span>
            </li>
            <li class="detail-item">
                <span class="label">
                    <i class="bi bi-tag"></i>
                    Category
                </span>
                <span class="val muted">Freelance Payment</span>
            </li>
            <li class="detail-item">
                <span class="label">
                    <i class="bi bi-check-circle"></i>
                    Status
                </span>
                <span class="val">
                    <span class="badge-success">
                        <i class="bi bi-circle-fill"></i>
                        Completed
                    </span>
                </span>
            </li>
        </ul>

        <!-- Buttons -->
        <div class="btn-group-custom">
            <button class="btn-receipt" type="button">
                <i class="bi bi-download"></i>
                Receipt
            </button>
            <button class="btn-done" type="button">
                <i class="bi bi-house-door"></i>
                Back to Home
            </button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ---------- Confetti ----------
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#6c63ff', '#00c9a7', '#ffd93d', '#ff6b6b', '#a78bfa', '#38bdf8'];

            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 8 + 4 + 'px';
                    confetti.style.height = Math.random() * 8 + 4 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2 + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    container.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 40);
            }
        }

        // Launch confetti on load
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 600);
        });
    </script>
</body>
</html>
