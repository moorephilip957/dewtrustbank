{% extends 'staff/base.html' %}

{% block title %}
Fund Account
{% endblock %}

{% block page_title %}
Fund Customer Account
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-lg-7">

        <div class="form-card">

            <form>

                <div class="mb-4">
                    <label>Account Number</label>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Enter account number"
                    >
                </div>

                <div class="mb-4">
                    <label>Amount</label>

                    <input
                        type="number"
                        class="form-control"
                        placeholder="Enter amount"
                    >
                </div>

                <div class="mb-4">
                    <label>Description</label>

                    <textarea
                        class="form-control"
                        rows="4"
                    ></textarea>
                </div>

                <button class="primary-btn">
                    Fund Account
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
