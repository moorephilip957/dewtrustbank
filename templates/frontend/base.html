{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="First Havin Bank International - Offering a comprehensive range of financial solutions including credit cards, mortgages, commercial banking, auto financing, investment services, retirement planning, and both personal and business banking.">

    {% load static pwa %}
    {% progressive_web_app_meta %}

    <!-- title -->
    <title>First Havin Bank - A Global Standard in Modern Banking</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'frontend/custom/favicons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'frontend/custom/favicons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'frontend/custom/favicons/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'frontend/custom/favicons/site.webmanifest' %}">

    <!-- Google Fonts Css-->
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Onest:wght@100..900&display=swap" rel="stylesheet">

    <!-- Bootstrap Css -->
    <!-- <link href="{% static 'frontend/temp/custom/assets/css/bootstrap.min.css' %}" rel="stylesheet" media="screen"> -->
    <link href="{% static 'bootstrap/bootstrap.min.css' %}" rel="stylesheet" media="screen">
    <!-- SlickNav Css -->
    <link href="{% static 'frontend/temp/custom/assets/css/slicknav.min.css' %}" rel="stylesheet">
    <!-- Swiper Css -->
    <link rel="stylesheet" href="{% static 'frontend/temp/custom/assets/css/swiper-bundle.min.css' %}">
    <!-- Font Awesome Icon Css-->
    <link href="{% static 'frontend/temp/custom/assets/css/all.css' %}" rel="stylesheet" media="screen">
    <!-- Animated Css -->
    <link href="{% static 'frontend/temp/custom/assets/css/animate.css' %}" rel="stylesheet">
    <!-- Magnific Popup Core Css File -->
    <link rel="stylesheet" href="{% static 'frontend/temp/custom/assets/css/magnific-popup.css' %}">
    <!-- Mouse Cursor Css File -->
    <link rel="stylesheet" href="{% static 'frontend/temp/custom/assets/css/mousecursor.css' %}">
    <!-- Main Custom Css -->
    <link href="{% static 'frontend/temp/custom/assets/css/custom.css' %}" rel="stylesheet" media="screen">
</head>

<body>

    <!-- Preloader Start -->
    <!-- <div class="preloader">
        <div class="loading-container">
            <div class="loading text-white"></div>
            <div id="loading-icon"><img src="{% static 'frontend/temp/custom/assets/images/loader.svg' %}" alt=""></div>
        </div>
    </div> -->
    <!-- Preloader End -->
    {% include './included/navbar.html' %}
    {% block content %}{% endblock %}
    {% include './included/footer.html' %}



    <!-- Jquery Library File -->
    <script src="{% static 'frontend/temp/custom/assets/js/jquery-3.7.1.min.js' %}"></script>
    <!-- Bootstrap js file -->
     <script src="{% static 'bootstrap/bootstrap.bundle.min.js' %}"></script>
    
    <!-- SlickNav js file -->
    <script src="{% static 'frontend/temp/custom/assets/js/jquery.slicknav.js' %}"></script>

    <!-- Main Custom js file -->
    <script src="{% static 'frontend/temp/custom/assets/js/function.js' %}"></script>

    
     
    



    <!-- google translate  -->
     <div class="gtranslate_wrapper"></div>
    <script>window.gtranslateSettings = {"default_language":"en","detect_browser_language":true,"wrapper_selector":".gtranslate_wrapper","alt_flags":{"en":"usa"}}</script>
    <script src="{% static 'frontend/widgets/latest/float.js' %}" defer=""></script>

</body>

</html>
