{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banking Dashboard | Customer Dashboard</title>
    <meta name="description" content="Swift and Secure Money Transfer Dashboard" />

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'frontend/custom/favicons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'frontend/custom/favicons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'frontend/custom/favicons/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'frontend/custom/favicons/site.webmanifest' %}">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Lucide Icons (for exact icon match) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- custom css -->
    <link rel="stylesheet" href="{% static 'customer/style.css' %}">
</head>
<body>

    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="text-center">
            <div class="loader-animation">
                <div class="loader-circle"></div>
                <div class="loader-circle"></div>
                <div class="loader-circle"></div>
                <div class="loader-circle"></div>
                <div class="loader-core"></div>
            </div>
            <div class="loader-text">BANKING DASHBOARD</div>
        </div>
    </div>
    {% include './include/sidebar.html' %}
    <!-- Main Content -->
    {% include './include/navbar.html' %}
    <main class="main-content">
    {% block content %}{% endblock %}
    {% include './include/footer.html' %}
    </main>

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- custom js -->
     <script src="{% static 'customer/app.js' %}"></script>

</body>
</html>
