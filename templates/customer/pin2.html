<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OTP Verification</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #0b1220;
  font-family: system-ui, sans-serif;
}

/* CARD */
.auth-card {
  max-width: 440px;
  margin: auto;
  border-radius: 24px;
  overflow: hidden;
  background: white;
  box-shadow: 0 25px 70px rgba(0,0,0,0.4);
}

/* TOP */
.top {
  background: linear-gradient(135deg, #6366f1, #14b8a6);
  height: 170px;
  position: relative;
  color: white;
  text-align: center;
  padding-top: 25px;
}

.circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
}

.c1 { width: 120px; height: 120px; top: -30px; left: -30px; }
.c2 { width: 90px; height: 90px; bottom: -20px; right: -20px; }

/* AVATAR */
.avatar-wrap {
  text-align: center;
  margin-top: -45px;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 4px solid white;
  object-fit: cover;
  background: white;
}

/* OTP INPUTS (DESKTOP) */
.otp-box {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 20px 0;
}

.otp-box input {
  width: 52px;
  height: 55px;
  text-align: center;
  font-size: 20px;
  border-radius: 12px;
  border: 1px solid #ddd;
}

/* BUTTON */
.btn-main {
  background: linear-gradient(135deg, #6366f1, #14b8a6);
  border: none;
  color: white;
  padding: 12px;
  border-radius: 12px;
  width: 100%;
  font-weight: 600;
}

/* RESEND */
.resend {
  text-align: center;
  font-size: 13px;
  margin-top: 10px;
}

/* COUNTDOWN */
#timer {
  font-weight: 600;
  color: #6366f1;
}

/* ================= MOBILE KEYPAD ================= */
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.keypad button {
  height: 55px;
  border-radius: 12px;
  border: 1px solid #eee;
  background: #fff;
  font-size: 18px;
  font-weight: 600;
}

.keypad button:active {
  transform: scale(0.95);
}

/* HIDE/SHOW */
.mobile-only { display: none; }
.desktop-only { display: block; }

/* RESPONSIVE */
@media (max-width: 768px) {
  .mobile-only { display: block; }
  .desktop-only { display: none; }
}

/* ================= SUCCESS OVERLAY ================= */
.success-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(11,18,32,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  z-index: 999;
}

.checkmark {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 5px solid #22c55e;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  animation: pop 0.6s ease;
}

@keyframes pop {
  0% { transform: scale(0); }
  80% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
</style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

<!-- SUCCESS SCREEN -->
<div class="success-overlay" id="success">
  <div class="checkmark">✓</div>
  <h4 class="mt-3">Verification Successful</h4>
</div>

<div class="auth-card">

  <!-- TOP -->
  <div class="top">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <h4>OTP Verification</h4>
    <p class="small">Secure login system</p>
  </div>

  <!-- AVATAR -->
  <div class="avatar-wrap">
    <img class="avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff">
  </div>

  <div class="p-4">

    <p class="text-center text-muted small">
      Enter the 6-digit OTP sent to you
    </p>

    <!-- DESKTOP INPUT -->
    <div class="desktop-only">
      <div class="otp-box">
        <input maxlength="1" class="otp">
        <input maxlength="1" class="otp">
        <input maxlength="1" class="otp">
        <input maxlength="1" class="otp">
        <input maxlength="1" class="otp">
        <input maxlength="1" class="otp">
      </div>
    </div>

    <!-- MOBILE KEYPAD -->
    <div class="mobile-only">
      <input id="mobileOtp" class="form-control text-center mb-3" readonly placeholder="Enter OTP">

      <div class="keypad">
        <button onclick="addNum(1)">1</button>
        <button onclick="addNum(2)">2</button>
        <button onclick="addNum(3)">3</button>
        <button onclick="addNum(4)">4</button>
        <button onclick="addNum(5)">5</button>
        <button onclick="addNum(6)">6</button>
        <button onclick="addNum(7)">7</button>
        <button onclick="addNum(8)">8</button>
        <button onclick="addNum(9)">9</button>
        <button onclick="clearOtp()">C</button>
        <button onclick="addNum(0)">0</button>
        <button onclick="backspace()">⌫</button>
      </div>
    </div>

    <!-- BUTTON -->
    <button class="btn-main mt-3" onclick="verify()">
      Verify OTP
    </button>

    <!-- RESEND -->
    <div class="resend">
      Resend OTP in <span id="timer">60</span>s
    </div>

  </div>
</div>

<script>
/* ================= DESKTOP OTP ================= */
const inputs = document.querySelectorAll(".otp");

inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    if (input.value && i < inputs.length - 1) {
      inputs[i + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !input.value && i > 0) {
      inputs[i - 1].focus();
    }
  });
});

/* ================= MOBILE OTP ================= */
let mobileOtp = "";

function addNum(n) {
  if (mobileOtp.length < 6) {
    mobileOtp += n;
    document.getElementById("mobileOtp").value = mobileOtp;
  }
}

function clearOtp() {
  mobileOtp = "";
  document.getElementById("mobileOtp").value = "";
}

function backspace() {
  mobileOtp = mobileOtp.slice(0, -1);
  document.getElementById("mobileOtp").value = mobileOtp;
}

/* ================= VERIFY ================= */
function verify() {
  document.getElementById("success").style.display = "flex";
  setTimeout(() => {
    document.getElementById("success").style.display = "none";
  }, 2500);
}

/* ================= TIMER ================= */
let time = 60;
let timer = setInterval(() => {
  time--;
  document.getElementById("timer").innerText = time;

  if (time <= 0) {
    clearInterval(timer);
    document.getElementById("timer").innerText = "Resend";
  }
}, 1000);
</script>

</body>
</html>
