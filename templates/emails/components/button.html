<table
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="margin-top:25px;"
>

    <tr>

        <td align="center">

            <a
                href="{{ url }}"
                style="
                    background:#0037CC;
                    color:#ffffff;
                    text-decoration:none;
                    padding:14px 28px;
                    border-radius:8px;
                    display:inline-block;
                    font-size:15px;
                    font-weight:600;
                "
            >
                {{ text }}
            </a>

        </td>

    </tr>

</table>
