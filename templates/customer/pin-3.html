<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OTP Verification</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #0b1220;
  font-family: system-ui, sans-serif;
}

/* MAIN CARD */
.auth-card {
  max-width: 430px;
  margin: auto;
  border-radius: 24px;
  overflow: hidden;
  background: white;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35);
}

/* ===================== */
/* 1. TOP HEADER SECTION */
/* ===================== */
.top-section {
  background: linear-gradient(135deg, #6366f1, #14b8a6);
  height: 180px;
  position: relative;
  overflow: hidden;
  color: white;
  text-align: center;
  padding-top: 25px;
}

.top-section h4 {
  font-weight: 700;
}

.top-section p {
  font-size: 13px;
  opacity: 0.9;
}

/* decorative circles */
.circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
}

.circle.one {
  width: 120px;
  height: 120px;
  top: -30px;
  left: -30px;
}

.circle.two {
  width: 90px;
  height: 90px;
  bottom: -20px;
  right: -20px;
}

/* ===================== */
/* 2. IMAGE SECTION */
/* ===================== */
.image-section {
  margin-top: -50px;
  text-align: center;
  position: relative;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 4px solid white;
  object-fit: cover;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  background: white;
}

/* ===================== */
/* 3. FORM SECTION */
/* ===================== */
.form-section {
  padding: 25px;
  margin-top: 10px;
}

.otp-box {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 20px 0;
}

.otp-box input {
  width: 52px;
  height: 55px;
  text-align: center;
  font-size: 20px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  transition: 0.2s;
}

.otp-box input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  outline: none;
  transform: scale(1.05);
}

.btn-verify {
  background: linear-gradient(135deg, #6366f1, #14b8a6);
  border: none;
  color: white;
  padding: 12px;
  border-radius: 12px;
  width: 100%;
  font-weight: 600;
  transition: 0.2s;
}

.btn-verify:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.small-text {
  text-align: center;
  font-size: 13px;
  color: #6b7280;
  margin-top: 12px;
}

.small-text a {
  color: #6366f1;
  text-decoration: none;
}
</style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

<div class="auth-card">

  <!-- ================= TOP SECTION ================= -->
  <div class="top-section">
    <div class="circle one"></div>
    <div class="circle two"></div>

    <h4>OTP Verification</h4>
    <p>Secure login authentication</p>
  </div>

  <!-- ================= IMAGE SECTION ================= -->
  <div class="image-section">
    <img class="avatar"
         src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
         alt="user">
  </div>

  <!-- ================= FORM SECTION ================= -->
  <div class="form-section">

    <p class="text-center text-muted small">
      Enter the 6-digit OTP sent to your device
    </p>

    <form id="otpForm">

      <div class="otp-box">
        <input type="text" maxlength="1" class="otp">
        <input type="text" maxlength="1" class="otp">
        <input type="text" maxlength="1" class="otp">
        <input type="text" maxlength="1" class="otp">
        <input type="text" maxlength="1" class="otp">
        <input type="text" maxlength="1" class="otp">
      </div>

      <button type="submit" class="btn-verify">
        Verify OTP
      </button>

      <div class="small-text">
        Didn’t receive code? <a href="#">Resend</a>
      </div>

    </form>

  </div>

</div>

<script>
const inputs = document.querySelectorAll(".otp");

inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    if (input.value && i < inputs.length - 1) {
      inputs[i + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !input.value && i > 0) {
      inputs[i - 1].focus();
    }
  });
});

document.getElementById("otpForm").addEventListener("submit", (e) => {
  e.preventDefault();

  let otp = "";
  inputs.forEach(i => otp += i.value);

  alert("OTP: " + otp);
});
</script>

</body>
</html>
