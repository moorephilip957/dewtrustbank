<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            margin: 0;
            padding: 0;
        }

        .email-container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .header {
            background: #0037CC;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 25px;
            color: #333;
        }

        .footer {
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #888;
            background: #f1f3ff;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #0037CC;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
            color: #0037CC;
        }
    </style>
</head>

<body>

<div class="email-container">

    <div class="header">
        <h2>First Havin Bank</h2>
    </div>

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

    <div class="footer">
        © {{ year }} First Havin Bank. All rights reserved.
    </div>

</div>

</body>
</html>
