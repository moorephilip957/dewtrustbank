{% extends "./base_email.html" %}

{% block content %}

<h3>New Support Response</h3>

<p>Hello {{ user_name }},</p>

<p>You have received a new reply on your ticket:</p>

<p><strong>Ticket:</strong> {{ ticket_reference }}</p>

<p style="margin-top:10px;">
    {{ message }}
</p>

<a href="{{ ticket_url }}" class="btn">
    View Ticket
</a>

{% endblock %}
