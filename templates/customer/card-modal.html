<style>
    /* CARD WRAPPER */
.atm-card-wrapper {
    width: 100%;
    max-width: 380px;
    height: 230px;
    perspective: 1200px;
}

/* CARD */
.atm-card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s ease;
}

/* ROTATE ON HOVER */
.atm-card-wrapper:hover .atm-card {
    transform: rotateY(180deg);
}

/* FRONT & BACK */
.atm-card-front,
.atm-card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    padding: 1.5rem;
    backface-visibility: hidden;
    overflow: hidden;
    color: white;
}

/* FRONT DESIGN */
.atm-card-front {
    background:
        linear-gradient(135deg, #111827, #1e3a8a, #2563eb);
    box-shadow:
        0 20px 40px rgba(0,0,0,.25);
}

/* BACK DESIGN */
.atm-card-back {
    background:
        linear-gradient(135deg, #0f172a, #1e293b);
    transform: rotateY(180deg);
}

/* CHIP */
.chip {
    width: 55px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #fcd34d, #f59e0b);
}

/* BLACK STRIP */
.black-strip {
    width: 100%;
    height: 50px;
    background: black;
    margin-top: 20px;
}

/* CVV */
.cvv-section {
    padding: 1.5rem;
}

.cvv-box {
    background: white;
    color: black;
    text-align: right;
    padding: .5rem .75rem;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 2px;
}

/* NUMBER SPACING */
.tracking-widest {
    letter-spacing: 4px;
}
</style>

<!-- View Button -->
<button 
    class="btn btn-outline-secondary btn-sm"
    data-bs-toggle="modal"
    data-bs-target="#cardModal{{ card.id }}">
    View
</button>


<!-- Card Modal -->
<div class="modal fade" id="cardModal{{ card.id }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 bg-transparent shadow-none">

            <div class="modal-body d-flex justify-content-center">

                <div class="atm-card-wrapper">

                    <div class="atm-card">

                        <!-- FRONT -->
                        <div class="atm-card-front">

                            <div class="d-flex justify-content-between align-items-start mb-5">
                                <div>
                                    <small class="text-white-50">Balance</small>
                                    <h4 class="fw-bold mb-0">
                                        ${{ card.account.balance|intcomma }}
                                    </h4>
                                </div>

                                <i class="bi bi-credit-card-2-front fs-2"></i>
                            </div>

                            <div class="chip mb-4"></div>

                            <h5 class="tracking-widest mb-4">
                                •••• •••• •••• {{ card.card_number|slice:"-4:" }}
                            </h5>

                            <div class="d-flex justify-content-between align-items-end">
                                <div>
                                    <small class="text-white-50 d-block">
                                        Card Holder
                                    </small>
                                    <span class="fw-medium">
                                        {{ card.account.user.get_full_name|default:card.account.user.username }}
                                    </span>
                                </div>

                                <div>
                                    <small class="text-white-50 d-block">
                                        Expires
                                    </small>
                                    <span>
                                        {{ card.expiry_date|date:"m/y" }}
                                    </span>
                                </div>
                            </div>

                        </div>


                        <!-- BACK -->
                        <div class="atm-card-back">

                            <div class="black-strip"></div>

                            <div class="cvv-section">
                                <div class="cvv-box">
                                    {{ card.cvv|default:"***" }}
                                </div>
                            </div>

                            <div class="mt-4 px-4 small text-white-50">
                                Authorized Signature
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
